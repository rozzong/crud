[project]
name = "crud"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sql = ["sqlmodel>=0.0.22", "sqlalchemy>=2"]

[dependency-groups]
dev = ["crud[sql]", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
